<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://lh3.googleusercontent.com" />
  <title>Daftar - Dulur</title>
  <link rel="stylesheet" href="css/style.css?v=12" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0eab6f" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" href="favicon.png" />
</head>
<body>

  <div class="app-header">
    <a href="index.html" class="header-back" aria-label="Kembali ke Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    Daftar Akun
  </div>

  <div class="container">
    <div class="info-note">
      Ini pendaftaran sederhana untuk tahap uji coba (belum pakai password).
      Sudah pernah daftar? <a href="login.html">Masuk di sini</a>.
    </div>

    <form id="daftarForm">
      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" id="nama" required placeholder="mis. Budi Santoso" />
      </div>

      <div class="form-group">
        <label>Nomor HP/WhatsApp</label>
        <input type="tel" id="no_hp" required placeholder="mis. 0812xxxxxxx" />
      </div>

      <div class="form-group">
        <label>Kecamatan</label>
        <input type="text" id="lokasi_kecamatan" required placeholder="mis. Boyolali Kota" />
      </div>

      <div class="form-group">
        <label>Kabupaten/Kota</label>
        <select id="kabupaten" required>
          <option value="Boyolali">Boyolali</option>
          <option value="Surakarta (Solo)">Surakarta (Solo)</option>
          <option value="Sukoharjo">Sukoharjo</option>
          <option value="Karanganyar">Karanganyar</option>
          <option value="Sragen">Sragen</option>
          <option value="Klaten">Klaten</option>
          <option value="Semarang">Semarang</option>
          <option value="Salatiga">Salatiga</option>
          <option value="Wonogiri">Wonogiri</option>
        </select>
      </div>

      <div class="form-group">
        <label>Kode Referral (opsional)</label>
        <input type="text" id="kode_referral_dipakai" placeholder="mis. BUDI123, kalau diajak teman" style="text-transform:uppercase;" />
      </div>

      <div class="form-group" style="display:flex; align-items:flex-start; gap:8px;">
        <input type="checkbox" id="setujuToS" required style="width:18px; height:18px; margin-top:2px; flex-shrink:0;" />
        <label for="setujuToS" style="font-weight:400; font-size:0.82rem;">
          Saya setuju <a href="peraturan.html" target="_blank">Syarat & Ketentuan</a> dan
          Peraturan Komunitas Dulur, termasuk aturan tentang barang terlarang dan etika bertransaksi.
        </label>
      </div>

      <button type="submit" class="btn btn-primary">Daftar</button>
      <p style="font-size:0.75rem; color:var(--color-muted); text-align:center; margin-top:12px;">
        Pendaftaran palsu/ganda melanggar Peraturan Komunitas dan bisa berujung penangguhan akun.
      </p>
    </form>
  </div>

  <script src="js/config.js?v=12"></script>
  <script src="js/setup-check.js?v=12"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/api.js?v=12"></script>
  <script src="js/toast.js?v=12"></script>
  <script src="js/session.js?v=12"></script>
  <script src="js/daftar.js?v=12"></script>
  <script src="js/register-sw.js?v=12"></script>
  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "c59e07c75c4c4782beb907baa909d35f"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
