  <link rel="stylesheet" href="css/style.css?v=7" />
  <style>
    .profile-hero {
      text-align: center;
      padding-bottom: 8px;
    }
    .profile-avatar-big {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 2rem;
      margin: -54px auto 12px;
      border: 5px solid var(--color-bg);
      box-shadow: 0 6px 16px rgba(14,171,111,0.28);
      position: relative;
      z-index: 5;
    }
    .profile-name {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 1.3rem;
      margin: 0 0 6px;
    }
    .info-list {
      background: var(--color-card);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      margin: 16px 0;
    }
    .info-list .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--color-border);
      font-size: 0.9rem;
    }
    .info-list .row:last-child { border-bottom: none; }
    .info-list .row svg { width: 18px; height: 18px; color: var(--color-primary); flex-shrink: 0; }
    .quick-link-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .quick-link {
      flex: 1;
      background: var(--color-card);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      padding: 14px 10px;
      text-align: center;
      text-decoration: none;
      color: var(--color-ink);
      font-size: 0.78rem;
      font-weight: 600;
    }
    .quick-link svg { width: 22px; height: 22px; color: var(--color-primary); margin-bottom: 6px; }
  </style>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0eab6f" />

</head>
