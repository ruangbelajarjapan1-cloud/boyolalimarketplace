<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil - Marketplace Boyolali</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="app-header">Profil Saya</div>

  <div class="container" id="profilContainer"></div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
      Home
    </a>
    <a href="chat-list.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      Chat
    </a>
    <span class="nav-spacer"></span>
    <a href="profil.html" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      Profil
    </a>
    <a href="upload.html" class="nav-fab" aria-label="Upload Barang">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </a>
  </nav>

  <script src="js/config.js"></script>
  <script src="js/setup-check.js"></script>
  <script src="js/api.js"></script>
  <script src="js/session.js"></script>
  <script>
    const user = getCurrentUser();
    const el = document.getElementById('profilContainer');

    if (!user) {
      el.innerHTML = `
        <p class="empty-state">Anda belum masuk.</p>
        <a class="btn btn-primary" href="login.html">Masuk</a>
        <br><br>
        <a class="btn btn-secondary" href="daftar.html">Daftar Akun Baru</a>
      `;
    } else {
      const verifBadge = user.is_verified_ktp
        ? '<span class="badge badge-verified">✅ Terverifikasi</span>'
        : '<span class="badge">Belum Terverifikasi</span>';
      el.innerHTML = `
        <h2>${user.nama}</h2>
        <p>${verifBadge}</p>
        <p>📱 ${user.no_hp || '-'}</p>
        <p>📍 ${user.lokasi_kecamatan || '-'}, ${user.kabupaten || '-'}</p>
        <div class="info-note">
          Mau dapat badge Terverifikasi? Kirim foto KTP Anda ke pengelola
          aplikasi lewat WhatsApp untuk diperiksa manual.
        </div>
        <button class="btn btn-secondary" onclick="logout(); location.reload();">
          Keluar
        </button>
      `;
    }
  </script>
</body>
</html>
