    .chat-row {
      display: flex;
      gap: 12px;
      align-items: center;
      background: var(--color-card);
      border-radius: var(--radius-md);
      padding: 12px;
      margin-bottom: 8px;
      box-shadow: var(--shadow-card);
      text-decoration: none;
      color: inherit;
    }
    .chat-row img { width: 52px; height: 52px; border-radius: var(--radius-sm); object-fit: cover; background: #eee; flex-shrink: 0; }
    .chat-row .info { flex: 1; min-width: 0; }
    .chat-row .lawan { font-weight: 700; font-size: 0.9rem; margin: 0; }
    .chat-row .produk { font-size: 0.75rem; color: var(--color-primary-dark); margin: 1px 0; }
    .chat-row .pesan { font-size: 0.8rem; color: var(--color-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 2px 0 0; }
    .chat-row .waktu { font-size: 0.68rem; color: var(--color-muted); flex-shrink: 0; }
  </style>
