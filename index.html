<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dulur — Jual Beli Warga Boyolali & Sekitarnya</title>
  <link rel="stylesheet" href="css/style.css?v=8" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0eab6f" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" href="favicon.png" />
</head>
<body>

  <div class="splash-screen" id="splashScreen">
    <img src="icon-192.png" alt="Dulur" />
    <div class="splash-title">Dulur</div>
    <div class="splash-tagline">jual beli sesama warga Boyolali & sekitarnya</div>
  </div>

  <div id="onboardingArea"></div>

  <div class="app-header">
    <div class="header-top-row">
      <div class="header-brand">🛍️ Dulur</div>
      <a href="profil.html" class="header-avatar" id="headerAvatar">👤</a>
    </div>
    <p class="header-greeting" id="greeting">Dulur</p>
    <p class="header-tagline">Dulur — jual beli sesama warga Boyolali & sekitarnya</p>
  </div>

  <div class="container">
    <input
      type="text"
      id="searchInput"
      class="search-box"
      placeholder="Cari barang... (mis. sepeda motor)"
    />

    <select id="kabupatenFilter" class="search-box">
      <option value="">Semua Wilayah (Boyolali & sekitarnya)</option>
      <option value="Boyolali">Boyolali</option>
      <option value="Surakarta (Solo)">Surakarta (Solo)</option>
      <option value="Sukoharjo">Sukoharjo</option>
      <option value="Karanganyar">Karanganyar</option>
      <option value="Sragen">Sragen</option>
      <option value="Klaten">Klaten</option>
      <option value="Semarang">Semarang</option>
      <option value="Salatiga">Salatiga</option>
      <option value="Wonogiri">Wonogiri</option>
    </select>

    <div id="adsBanner"></div>

    <div class="category-chips" id="categoryChips">
      <div class="chip active" data-kategori="">🏠 Semua</div>
      <div class="chip chip-hibah" data-kategori="HIBAH">🎁 Hibah (Gratis)</div>
      <div class="chip" data-kategori="Kendaraan">🚗 Kendaraan</div>
      <div class="chip" data-kategori="Elektronik">📱 Elektronik</div>
      <div class="chip" data-kategori="Baju">👕 Baju</div>
      <div class="chip" data-kategori="Perabot">🛋️ Perabot</div>
      <div class="chip" data-kategori="Pertanian">🌾 Pertanian</div>
      <div class="chip" data-kategori="Lainnya">📦 Lainnya</div>
    </div>

    <div id="featuredSection"></div>

    <div class="filter-sort-row">
      <select id="urutkanFilter">
        <option value="terbaru">🕓 Terbaru</option>
        <option value="termurah">💰 Termurah</option>
        <option value="termahal">💎 Termahal</option>
      </select>
      <select id="hargaMaxFilter">
        <option value="">Semua Harga</option>
        <option value="50000">Di bawah 50rb</option>
        <option value="100000">Di bawah 100rb</option>
        <option value="500000">Di bawah 500rb</option>
        <option value="1000000">Di bawah 1jt</option>
      </select>
    </div>

    <p class="section-title" id="gridTitle">Barang Terbaru</p>
    <div id="productGrid" class="product-grid">
      <p class="empty-state">Memuat produk...</p>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
      Home
    </a>
    <a href="chat-list.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      Chat
    </a>
    <span class="nav-spacer"></span>
    <a href="barang-saya.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
      Barang Saya
    </a>
    <a href="profil.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      Profil
    </a>
    <a href="upload.html" class="nav-fab" aria-label="Upload Barang">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </a>
  </nav>

  <script src="js/config.js?v=8"></script>
  <script src="js/setup-check.js?v=8"></script>
  <script src="js/api.js?v=8"></script>
  <script src="js/session.js?v=8"></script>
  <script src="js/home.js?v=8"></script>
  <script src="js/register-sw.js?v=8"></script>
</body>
</html>
